<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ML Sentinel</title><style>
:root{--bg:#0d1117;--panel:#141b23;--ink:#eef5ff;--muted:#94a6ba;--acc:#4da3ff;--green:#6de3a5;--red:#ff7b86;--line:#263342}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b121a,#0d1117);font-family:Inter,system-ui;color:var(--ink)}main{max-width:1180px;margin:auto;padding:34px}.top{display:flex;justify-content:space-between}.brand{font-size:25px;font-weight:900}.tag{color:var(--acc)}h1{font-size:46px;margin:48px 0 10px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.value{font-size:31px;font-weight:900;margin-top:7px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.muted{color:var(--muted)}input{width:100%;background:#0e151d;border:1px solid var(--line);color:white;padding:10px;border-radius:9px;margin:5px 0 10px}button{background:var(--acc);border:0;padding:11px 14px;border-radius:9px;font-weight:800;cursor:pointer;margin-right:7px}.bar{height:8px;background:#0e151d;border-radius:8px;overflow:hidden;margin-top:6px}.fill{height:100%;background:var(--green)}.row{padding:11px 0;border-bottom:1px solid var(--line)}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}h1{font-size:36px}}
</style></head><body><main><div class="top"><div class="brand">ML Sentinel</div><div class="tag">Model lifecycle + drift monitoring</div></div><h1>Know when your model stops behaving like training.</h1><p class="muted">Training metrics, live predictions, drift checks and model versioning in one MLOps portfolio demo.</p><div class="cards"><div class="card"><span class="muted">ROC-AUC</span><div class="value" id="auc">—</div></div><div class="card"><span class="muted">F1</span><div class="value" id="f1">—</div></div><div class="card"><span class="muted">Model</span><div class="value" id="version">—</div></div><div class="card"><span class="muted">Drift</span><div class="value" id="drift">—</div></div></div><div class="layout"><section class="card"><h3>Online prediction</h3><label>Age<input id="age" value="37"></label><label>Income<input id="income" value="52000"></label><label>Utilization<input id="utilization" value="0.72"></label><label>Late payments<input id="late" value="2"></label><label>Tenure years<input id="tenure" value="3"></label><button onclick="predict()">Score</button><button onclick="retrain()">Retrain model</button><p id="pred" class="muted"></p></section><section class="card"><h3>Data drift monitor</h3><button onclick="check('stable')">Stable batch</button><button onclick="check('shifted')">Shifted batch</button><div id="scores"></div></section></div></main><script>
async function metrics(){let m=await(await fetch('/api/metrics')).json();auc.textContent=m.roc_auc;f1.textContent=m.f1;version.textContent=m.version}async function check(mode){let d=await(await fetch('/api/drift?mode='+mode)).json();drift.textContent=d.status==='stable'?'Stable':'Alert';drift.style.color=d.status==='stable'?'var(--green)':'var(--red)';scores.innerHTML=Object.entries(d.scores).map(([k,v])=>`<div class="row"><b>${k}</b><span style="float:right">PSI ${v}</span><div class="bar"><div class="fill" style="width:${Math.min(100,v*220)}%;background:${v>=.2?'var(--red)':'var(--green)'}"></div></div></div>`).join('')}async function predict(){let body={age:+age.value,income:+income.value,utilization:+utilization.value,late_payments:+late.value,tenure_years:+tenure.value};let d=await(await fetch('/api/predict',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})).json();pred.innerHTML=`Predicted risk: <b>${(d.probability*100).toFixed(1)}%</b> · class ${d.label}`}async function retrain(){await fetch('/api/retrain',{method:'POST'});metrics()}metrics();check('shifted');predict();</script></body></html>
