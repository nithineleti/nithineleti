<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecSysX</title><style>
:root{--bg:#10101b;--panel:#171727;--ink:#f4f0ff;--muted:#aaa4c6;--acc:#a988ff;--line:#2b2941}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#2b1d53,#10101b 42%);font-family:Inter,system-ui;color:var(--ink)}main{max-width:1160px;margin:auto;padding:36px}.top{display:flex;justify-content:space-between}.brand{font-size:25px;font-weight:900}.tag{color:var(--acc)}h1{font-size:48px;margin:52px 0 10px}.controls{display:flex;gap:10px;align-items:center;margin:25px 0}select{background:var(--panel);color:white;border:1px solid var(--line);border-radius:10px;padding:11px 15px}.layout{display:grid;grid-template-columns:.65fr 1.35fr;gap:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.recgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rec{background:#11111e;border:1px solid var(--line);border-radius:14px;padding:16px}.score{font-size:25px;color:var(--acc);font-weight:900}.badge{display:inline-block;background:#282242;color:#cfc1ff;padding:4px 8px;border-radius:99px;font-size:11px}.hist{padding:10px 0;border-bottom:1px solid var(--line)}.muted{color:var(--muted)}@media(max-width:800px){.layout,.recgrid{grid-template-columns:1fr}h1{font-size:37px}}
</style></head><body><main><div class="top"><div class="brand">RecSysX</div><div class="tag">Hybrid personalization engine</div></div><h1>Recommendations with an explanation.</h1><p class="muted">Blends content similarity, collaborative behavior and popularity—then exposes score components for debugging.</p><div class="controls">User <select id="user" onchange="load()"></select><span id="metrics" class="muted"></span></div><div class="layout"><section class="card"><h3>Interaction history</h3><div id="history"></div></section><section class="card"><h3>Top recommendations</h3><div class="recgrid" id="recs"></div></section></div></main><script>
async function init(){let u=await (await fetch('/api/users')).json();user.innerHTML=u.users.map(x=>`<option>${x}</option>`).join('');let m=await(await fetch('/api/metrics')).json();metrics.textContent=`${m.items} items · ${m.interactions} interactions · ${(m.catalog_coverage_at_5*100).toFixed(0)}% coverage@5`;load()}async function load(){let d=await(await fetch('/api/recommend?user_id='+user.value)).json();history.innerHTML=d.history.map(x=>`<div class="hist"><b>${x.name}</b><span style="float:right">${'★'.repeat(x.rating)}</span></div>`).join('');recs.innerHTML=d.recommendations.map(x=>`<div class="rec"><span class="badge">${x.category}</span><h3>${x.name}</h3><p class="muted">${x.description}</p><div class="score">${Math.round(x.score*100)}</div><small class="muted">content ${x.content} · collaborative ${x.collaborative}</small></div>`).join('')}init();</script></body></html>
