services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finsight}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-finsight-local-secret}
    volumes:
      - finsight_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
volumes:
  finsight_minio:
