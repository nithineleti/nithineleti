name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./runtime/ci.db
      SECRET_KEY: ci-secret-that-is-long-enough-for-tests-123456789
      APP_ENV: test
      EMBEDDING_BACKEND: local_hashing
      RERANKER_BACKEND: feature
      GENERATOR_BACKEND: extractive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p runtime
      - run: alembic upgrade head
      - run: python -m compileall app scripts
      - run: pytest -q
