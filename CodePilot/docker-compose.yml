services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codepilot
      POSTGRES_USER: codepilot
      POSTGRES_PASSWORD: codepilot_local_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepilot -d codepilot"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      APP_SECRET: ${APP_SECRET:-replace-this-secret-before-deployment}
      DATABASE_URL: postgresql+psycopg://codepilot:codepilot_local_change_me@db:5432/codepilot
      WORKSPACE_ROOT: /app/workspaces
      INLINE_WORKER: "false"
      CORS_ORIGINS: http://localhost:8080
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@codepilot.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoPass123!}
      INFERENCE_URL: ${INFERENCE_URL:-}
      INFERENCE_TOKEN: ${INFERENCE_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - workspaces:/app/workspaces
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: production
      APP_SECRET: ${APP_SECRET:-replace-this-secret-before-deployment}
      DATABASE_URL: postgresql+psycopg://codepilot:codepilot_local_change_me@db:5432/codepilot
      WORKSPACE_ROOT: /app/workspaces
      INLINE_WORKER: "false"
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@codepilot.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoPass123!}
      INFERENCE_URL: ${INFERENCE_URL:-}
      INFERENCE_TOKEN: ${INFERENCE_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - workspaces:/app/workspaces
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  workspaces:
